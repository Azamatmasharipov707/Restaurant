<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
        integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="../css/contact.css">
    <link rel="shortcut icon" href="image/logo.svg" type="image/x-icon">
    <title>Restaurant</title>
</head>

<body>
    <header>

    </header>
    <main>
        <div class="container">
            <h1 class="contact_title">Contact us</h1>
            <p class="paragraph_title">We love hearing from our customers. Feel free to share your experience or ask any
                questions you may have.</p>

            <form class="contact__form">
                <div>
                    <input class="input" type="text" placeholder="First name" required>
                    <input class="input" type="text" placeholder="Last name" required>
                </div>
                <div>
                    <input class="input" type="email" placeholder="Email address" required>
                    <input class="input" type="text" placeholder="Subject">
                </div>
                <textarea class="contact_f_text" placeholder="Message" rows="4"></textarea>
                <div class="submit_div">
                    <button class="submit" type="submit">Submit</button>
                </div>
                <div class="maps">
                    <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d2985.50046147948!2d60.619308576572536!3d41.558412085368694!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x41dfc9842c81fc9d%3A0x9e434d2b8a616ce9!2sIT%20Park!5e0!3m2!1sen!2s!4v1763070328670!5m2!1sen!2s" width="1200" height="500" style="border:0;" allowfullscreen="" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>
                </div>
            </form>
        </div>
    </main>
    <footer></footer>
</body>

</html>
