<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
        integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="../css/contact.css">
    <link rel="shortcut icon" href="image/logo.svg" type="image/x-icon">
    <title>Restaurant</title>
</head>

<body>
    <header>

    </header>
    <main>
        <div class="container">
            <h1 class="contact_title">Contact us</h1>
            <p class="paragraph_title">We love hearing from our customers. Feel free to share your experience or ask any
                questions you may have.</p>
    
            <form class="contact__form">
                <div>
                    <input class="input" type="text" placeholder="First name" required>
                <input class="input" type="text" placeholder="Last name" required>
                </div>
                <div>
                <input class="input" type="email" placeholder="Email address" required>
                <input class="input" type="text" placeholder="Subject">
                </div>
                <textarea class="contact_f_text" placeholder="Message" rows="4"></textarea>
                <button type="submit">Send Message</button>
            </form>
        </div>
    </main>
    <footer></footer>
</body>

</html>
