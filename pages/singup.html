<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="/css/style.css">
    <link rel="shortcut icon" href="/image/login/Logo Delizioso.png" type="image/x-icon">
    <title>Sing up</title>
</head>
<body>
    <div class="singup">
    
        <div class="singup_title">
             <div class="logo">
        <img src="/image/login/Logo Delizioso.png" alt="">
        </div>
            <h1>Sing up</h1>
            <div class="login">
                <p>Don't have an account? <a href="login.html" >Log in</a> </p>
            </div>
            <div class="singup_input">
                <input type="text" placeholder="Full name" required>
            </div>
            <div class="singup_input">
                <input type="email" placeholder="Email address" required>
            </div>
            <div class="singup_input">
                <input type="password" placeholder="Password" required>
            </div>
            <div class="singup_password">
                <div class="singup_checkbox">
                    <input type="checkbox">
                    <p>Remember  me</p>
                </div>
                <a href="#!">Forget Password?</a>
            </div>
            <div class="singup_btn">
                <button>Log in</button>
            </div>
            <div class="google_btn">
                <button><img src="/image/login/google 1.svg" alt="">
                    <p>Log in with google</p>
                </button>
            </div>
        </div>
        </div>
</body>
</html>
